services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: securezim
      POSTGRES_USER: securezim
      POSTGRES_PASSWORD: securezim_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://securezim:securezim_dev_password@db:5432/securezim
      SCAN_TIMEOUT: "3"
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  postgres_data:
